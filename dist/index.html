<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Wavecraft：免费的 FPGA 工程时序图工作台。事件级边沿编辑、总线、算法和时序标注。"><title>Wavecraft Studio · FPGA 时序工作台</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="brandmark">⌁</span><strong>Wavecraft<span>STUDIO</span></strong></div><div class="project"><input id="projectTitle" aria-label="工程名称" maxlength="200"><span id="saveStatus">● 本机自动保存</span></div><div class="grow"></div><button id="recent">工程库</button><button id="openProject">打开</button><button id="saveProject">↓ 保存工程</button><button id="exportMenu" class="primary">导出 ↗</button><button id="theme" title="切换深浅主题">◐</button><button id="help" title="快捷键与指南">?</button></header>
<nav class="commandbar"><div class="commandgroup"><button data-add="clock">＋ 时钟</button><button data-add="digital">＋ 信号</button><button data-add="bus">＋ 总线</button><button data-add="analog">＋ 数值曲线</button><button data-add="separator">＋ 分隔</button></div><div class="line"></div><div class="commandgroup"><button id="undo" title="Ctrl+Z">↶</button><button id="redo" title="Ctrl+Y">↷</button></div><div class="line"></div><button id="rangeEdit">区间编辑</button><button id="generator">ƒ 生成器</button><select id="template" aria-label="载入协议模板"><option value="">协议 / 算法模板</option><option value="spi">SPI 传输</option><option value="axi">AXI Stream · 反压</option><option value="pipeline">算法流水线</option><option value="pcie">PCIe 事务层</option><option value="csi">MIPI CSI-2</option><option value="dsi">MIPI DSI</option><option value="dphy">MIPI D-PHY</option></select><div class="grow"></div><button id="newProject">新建</button><button id="projectSettings">工程设置</button></nav>
<div class="application"><aside class="signalpanel"><div class="panelheading"><span>信号与分组</span><span class="badge" id="signalCount"></span></div><div class="filterrow"><input id="search" placeholder="搜索信号或分组…" aria-label="搜索信号"><button id="groupEdit" title="批量设置分组">▤</button></div><div class="signalcaption"><span>名称 / 类型</span><span id="rowActions"><button id="rowUp" title="上移">↑</button><button id="rowDown" title="下移">↓</button></span></div><div id="signalList"></div><div class="signalfooter"><span id="selectedCount"></span><button id="duplicate" title="复制选中信号">复制</button><button id="deleteRows" title="删除选中信号">删除</button></div></aside>
<main class="editor"><div class="editbar"><div class="tools" id="tools"><button data-tool="select" class="active" title="V 选择 / 拖动边沿">↖ 选择</button><button data-tool="draw" title="D 绘制电平">⌁ 绘制</button><button data-tool="range" title="R 框选时间区间">▧ 区间</button><span class="line"></span><button data-tool="arrow" title="A 箭头">↗</button><button data-tool="curve" title="曲线箭头">⤴</button><button data-tool="interval" title="I 时间间隔">↔</button><button data-tool="setup" title="Setup 建立时间">tSU</button><button data-tool="hold" title="Hold 保持时间">tH</button><button data-tool="text" title="T 文字标注">T</button><button data-tool="break" title="时间断裂标记（不压缩时间）">⫽</button></div><div class="grow"></div><button id="zoomOut" title="缩小">−</button><span id="zoomLabel">100%</span><button id="zoomIn" title="放大">＋</button><button id="fit">适配</button></div><div class="timelinebar"><span id="toolHint">拖动跳变点调整时间 · 双击波形新增跳变 · 双击总线编辑段值</span><div class="grow"></div><label><input type="checkbox" id="snap" checked> 吸附</label><label>网格 <input id="grid" type="number" min="0.000001" step="any" aria-label="时间网格"> ns</label><select id="drawValue" aria-label="绘制电平"><option value="1">高电平 1</option><option value="0">低电平 0</option><option value="X">未知 X</option><option value="Z">高阻 Z</option></select></div><div id="canvasScroll"><svg id="canvas" xmlns="http://www.w3.org/2000/svg" aria-label="时序图编辑画布"></svg></div><div class="canvasbottom"><span id="projectDescription"></span><span class="grow"></span><span id="durationLabel"></span></div></main>
<aside class="properties"><div class="panelheading"><span>属性</span><span class="badge" id="propertyType">PROJECT</span></div><div id="propertyBody"></div></aside></div>
<footer><span class="statusdot"></span><span id="status">就绪</span><div class="grow"></div><span id="pointerTime">t = —</span><span id="rangeStatus">未选择时间区间</span><button id="shortcuts">快捷键</button><span class="version">v3.0 · LOCAL FIRST</span></footer><input type="file" id="projectFile" accept=".json,.wavecraft,.vcd" hidden><dialog id="dialog"></dialog><div id="toast" role="status"></div><script src="core.js"></script><script src="expression.js"></script><script src="app.js"></script><script src="themes.js"></script><script src="navigation.js"></script><script src="workbench.js"></script></body></html>
