const WC = (() => {
  const palette=['#2474b8','#008b79','#9465bb','#cc8431','#c55973','#528238'];
  const copy=x=>JSON.parse(JSON.stringify(x));
  const uid=()=>Math.random().toString(36).slice(2,11);
  const fmt=n=>Number(Number(n).toPrecision(9)).toString();
  function normalize(events,duration,type){
    const sorted=events.map(e=>({t:+e.t,v:String(e.v)})).filter(e=>Number.isFinite(e.t)&&e.t>=0&&e.t<duration).sort((a,b)=>a.t-b.t);
    let out=[];for(const e of sorted){if(out.length&&out.at(-1).t===e.t)out[out.length-1]=e;else out.push(e)}
    if(!out.length||out[0].t!==0)out.unshift({t:0,v:type==='bus'?'IDLE':'0'});
    return out.filter((e,i)=>i===0||e.v!==out[i-1].v);
  }
  function signal(name,type='digital',events=[{t:0,v:'0'}],group='',index=0){return{id:uid(),name,type,group,color:palette[index%palette.length],width:type==='bus'?8:1,events,period:20,duty:50,phase:0,rise:0,fall:0,differential:false,invert:false}}

  function zoomAt({scale,scrollLeft,anchor,left=158,factor,min=.000001,max=10000}){

    return{scale:next,scrollLeft:Math.max(0,left+time*next-anchor)};
  }
